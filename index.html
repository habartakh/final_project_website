<html>

<head>
    <title>Final Project</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="custom.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <script src="https://s3.eu-west-1.amazonaws.com/rosject.io/js/roslib.min.js"></script>

    <!-- <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.js"></script> -->

    <!-- EventEmitter2 (needed by mjpegcanvas) -->
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@0.4.14/lib/eventemitter2.js"></script>
    <script type="text/javascript" src="./libs/mjpegcanvas.min.js"></script>

    <!-- <script type="text/javascript" src="roslib.js"></script> -->

    <!-- 3D visualization -->
    <script src="./libs/three.min.js"></script>
    <script src="./libs/ColladaLoader.js"></script>
    <script src="./libs/ColladaLoader2.js"></script>
    <script src="./libs/STLLoader.js"></script>
    <script src="./libs/ros3d.min.js"></script>
</head>

<body>
    <!-- header of the page -->
    <header class="header">
        <div class="container">
            <div class="jumbotron text-center">
                <h1>Visual Calibration Dashboard</h1>
            </div>
        </div>
    </header>

    <!-- main content -->
    <main id="vueApp">
        <div class="container-fluid p-3 m-0">
            <div class="row">
                <div class="col-md-4">
                    <div class="card border-light mb-3" style="max-width: 20rem;">
                        <div class="card-body">
                            <h3>{{ menu_title }}</h3>
                            <hr>
                            <label class="text-light">ROSBridge address</label>
                            <br>
                            <input type="text" class="form-control" v-model="rosbridge_address" />
                            <br>
                            <button class="mt-2 btn btn-light" v-if="connected" @click="disconnect">Connected!</button>
                            <button class="mt-2 btn btn-primary" v-else @click="connect">Connect!</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card border-light mb-3">
                        <div class="joint-control-container">
                            <h3>Set Joint Positions</h3>

                            <div v-for="(value, index) in jointInputs" :key="index"
                                class="joint-input d-flex align-items-center mb-2">
                                <label class="form-label me-2 mb-0" style="width: 100px;">Joint {{ index + 1 }}:</label>
                                <input class="form-control flex-grow-1" type="number"
                                    v-model.number="jointInputs[index]" step="0.01" />
                            </div>

                            <button class="mt-2 btn btn-primary" :disabled="!connected" @click="sendJointValues">Send
                                Joint Positions</button>

                            <div v-if="serviceResult !== null">
                                <p v-if="serviceResult"> Joint positions sent successfully!</p>
                                <p v-else> Failed to send joint positions.</p>
                            </div>
                        </div>
                    </div>
                </div>


            </div>


            <!-- Sencond Row  -->
            <div class="row">

                <!-- Robot TF Visualization (updated layout) -->
                <div class="col-md-7">
                    <div class="card border-light mb-3">
                        <div class="card-body position-relative" style="padding: 0;">
                            <!-- <h2 class="text-center">Robot Model</h2>
                            <hr> -->

                            <!-- 3D Viewer (fills the card) -->
                            <div id="div3DViewer" style="width: 100%; height: 500px;"></div>

                            <!-- Camera feed (overlayed at top-right corner) -->
                            <div id="divCamera" class="camera-overlay"></div>

                            <!-- Progress Bar -->
                            <div class="progress" v-show="showProgressBar" style="margin-top: 10px;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                                    :aria-valuenow="progress" aria-valuemin="0" aria-valuemax="100"
                                    :style="{ width: progress + '%' }">
                                    {{ Math.floor(progress) }}%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- Camera Video feed Container  -->
                <div class="col-md-5">
                    <div class="card border-light mb-3">
                        <div class="card-body">
                            <h2 class="text-center">Camera</h2>
                            <hr>
                            <!-- <div id="divCamera"></div> -->
                            <!-- <p>Some actions for the robot</p>-->
                            <button class="mt-2 btn btn-primary" :disabled="!connected" @click="startTrajectory">Start
                                Trajectory!</button>
                            <button class="mt-2 btn btn-primary" :disabled="!connected" @click="startTFBroadcast">Start
                                TF Broadcasting!</button>
                        </div>
                    </div>
                </div>




                <!-- Robot TF Visualization-->
                <!-- <div class="col-md-6">
                    <div class="card border-light mb-3">
                        <div class="card-body">
                            <h2 class="text-center">Robot Model</h2>
                            <hr>
                            <div id="div3DViewer"></div> -->

                <!-- Progress Bar -->
                <!-- <div class="progress" v-show="showProgressBar" style="margin-top: 10px;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                                    :aria-valuenow="progress" aria-valuemin="0" aria-valuemax="100"
                                    :style="{ width: progress + '%' }">
                                    {{ Math.floor(progress) }}%
                                </div>
                            </div>

                        </div>
                    </div>
                </div> -->
            </div>


        </div>
    </main>


    <!-- footer -->
    <footer>
        <div class="container">
            <h6>page ends here!</h6>
        </div>
    </footer>

    <script type="text/javascript">
        // We could have loaded main.js simply with:
        //  <script type="text/javascript" src="main.js">
        // BUT we were having caching-related problems.
        // Loading main.js with a Date.now() in the URL we avoid using cache

        var script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'main.js?v=16.' + Date.now();
        document.head.appendChild(script);
    </script>

</body>

</html>
